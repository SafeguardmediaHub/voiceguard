name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"            # nightly 03:00 UTC = 04:00 WAT

jobs:
  fast:                            # every push + PR; no secrets, no weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # must match Dockerfile (audioop-lts, numpy 2.4, torch 2.12)
          cache: pip
      # ubuntu-latest has no GPU, but PyPI's linux torch wheels are the CUDA build:
      # torch alone is 532 MB and drags in nvidia-cublas / cudnn / nccl / nvshmem /
      # cusparselt / triton (~1.7 GB of wheels, several GB unpacked, cached wheel copy
      # on top). That is what filled the runner's disk -> "[Errno 28] No space left on
      # device". Pre-install the +cpu builds of the same pinned versions from PyTorch's
      # CPU index. --no-deps keeps every transitive pin coming from requirements.txt,
      # which then sees torch==X as already satisfied by X+cpu (PEP 440 ignores the
      # local label), so the next step downloads no torch at all.
      - name: Install CPU-only torch stack
        run: |
          pins=$(grep -E '^torch(audio|vision|codec)?==' requirements.txt)
          echo "$pins"
          pip install --no-deps --index-url https://download.pytorch.org/whl/cpu $pins
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          VOICEGUARD_CI_FAST: "1"

  weights:                         # model tests where the bundle can be pulled
    # default-branch push, manual dispatch, or nightly — never on a (fork) PR,
    # so Spaces secrets are never exposed to untrusted PR code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # must match Dockerfile (audioop-lts, numpy 2.4, torch 2.12)
          cache: pip
      # Same CPU-wheel preinstall as the fast job — see the comment there for why.
      - name: Install CPU-only torch stack
        run: |
          pins=$(grep -E '^torch(audio|vision|codec)?==' requirements.txt)
          echo "$pins"
          pip install --no-deps --index-url https://download.pytorch.org/whl/cpu $pins
      - run: pip install -r requirements.txt
      - name: Cache model bundle
        uses: actions/cache@v4
        with:
          path: model_store
          key: bundle-${{ github.sha }}
          restore-keys: bundle-
      - name: Pull active bundle from Spaces
        run: |
          # registry.jsonl records the machine-local bundle directory.  The
          # checked-in/cache copy can therefore name a Windows path, which is
          # invalid on this Linux runner.  Rebuild this local registry entry
          # from the freshly pulled active bundle on every weights run.
          rm -f model_store/registry.jsonl
          python bundle_registry.py pull --active
        env:
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_REGION: ${{ secrets.SPACES_REGION }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
      - run: python -m pytest -q            # full suite incl. golden regression

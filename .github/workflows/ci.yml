name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"            # nightly 03:00 UTC = 04:00 WAT

jobs:
  fast:                            # every push + PR; no secrets, no weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # must match Dockerfile (audioop-lts, numpy 2.4, torch 2.12)
          cache: pip
      # ubuntu-latest has no GPU, but PyPI's linux torch wheels are the CUDA build:
      # torch alone is 532 MB and drags in nvidia-cublas / cudnn / nccl / nvshmem /
      # cusparselt / triton (~1.7 GB of wheels, several GB unpacked, cached wheel copy
      # on top). That is what filled the runner's disk -> "[Errno 28] No space left on
      # device". Pre-install the +cpu builds of the same pinned versions from PyTorch's
      # CPU index. --no-deps keeps every transitive pin coming from requirements.txt,
      # which then sees torch==X as already satisfied by X+cpu (PEP 440 ignores the
      # local label), so the next step downloads no torch at all.
      - name: Install CPU-only torch stack
        run: |
          pins=$(grep -E '^torch(audio|vision|codec)?==' requirements.txt)
          echo "$pins"
          pip install --no-deps --index-url https://download.pytorch.org/whl/cpu $pins
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          VOICEGUARD_CI_FAST: "1"

  weights:                         # model tests where the bundle can be pulled
    # default-branch push, manual dispatch, or nightly — never on a (fork) PR,
    # so Spaces secrets are never exposed to untrusted PR code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # must match Dockerfile (audioop-lts, numpy 2.4, torch 2.12)
          cache: pip
      # Same CPU-wheel preinstall as the fast job — see the comment there for why.
      - name: Install CPU-only torch stack
        run: |
          pins=$(grep -E '^torch(audio|vision|codec)?==' requirements.txt)
          echo "$pins"
          pip install --no-deps --index-url https://download.pytorch.org/whl/cpu $pins
      - run: pip install -r requirements.txt
      # The weights tier decodes the shipped MP3 golden/probe clips through
      # detector.detect().  GitHub's runner image does not guarantee ffmpeg.
      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Cache model bundle
        uses: actions/cache@v4
        with:
          path: model_store
          key: bundle-${{ github.sha }}
          restore-keys: bundle-
      - name: Pull active bundle from Spaces
        run: |
          # registry.jsonl records the machine-local bundle directory.  The
          # checked-in/cache copy can therefore name a Windows path, which is
          # invalid on this Linux runner.  Rebuild this local registry entry
          # from the freshly pulled active bundle on every weights run.
          rm -f model_store/registry.jsonl
          python bundle_registry.py pull --active
        env:
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_REGION: ${{ secrets.SPACES_REGION }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
      - run: python -m pytest -q            # full suite incl. golden regression

  deploy:
    # CD is deliberately limited to successful pushes to the default branch.  It
    # never runs for pull requests, scheduled CI, or a manual test workflow run.
    # Set the repository variable VOICEGUARD_CD_ENABLED=true only after the
    # required deployment secrets have been configured (see this job's env).
    name: Build and deploy production image
    needs: [fast, weights]
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.VOICEGUARD_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY: registry.digitalocean.com/safeguardmedia
      IMAGE_TAG: ${{ github.sha }}
      DOCR_TOKEN: ${{ secrets.DOCR_TOKEN }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
      SPACES_KEY: ${{ secrets.SPACES_KEY }}
      SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
      SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
      SPACES_REGION: ${{ secrets.SPACES_REGION }}
      SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      # Do not use Ubuntu's preinstalled botocore: it is older than the
      # checksum options configured in remote_store.py.  Keep this aligned with
      # the CI jobs and the production image.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The active v9h bundle is intentionally baked into the image.  Pull it
      # fresh here rather than relying on a workstation-only model directory.
      - name: Install bundle downloader
        run: python -m pip install --disable-pip-version-check --upgrade numpy boto3
      - name: Pull active model bundle
        run: |
          rm -f model_store/registry.jsonl
          python bundle_registry.py pull --active

      - uses: docker/setup-buildx-action@v3
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/voiceguard:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/voiceguard:latest
          # This persists Docker layers between GitHub runners.  A small code
          # change should reuse ffmpeg, Python packages, Hugging Face assets,
          # and the unchanged v9h bundle instead of downloading them again.
          cache-from: type=gha,scope=voiceguard-production
          cache-to: type=gha,mode=max,scope=voiceguard-production

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/voiceguard_deploy
          chmod 600 ~/.ssh/voiceguard_deploy
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy the exact image that passed CI
        run: |
          ssh -i ~/.ssh/voiceguard_deploy -o IdentitiesOnly=yes root@"$DROPLET_HOST" \
            "IMAGE='${REGISTRY}/voiceguard:${IMAGE_TAG}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/voiceguard
          sed -i "s|^VOICEGUARD_IMAGE=.*|VOICEGUARD_IMAGE=${IMAGE}|" .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate
          docker compose -f docker-compose.prod.yml ps
          BIND_IP=$(sed -n 's/^VG_BIND_IP=//p' .env)
          curl -skf --resolve "voiceguard.internal:8443:${BIND_IP}" \
            https://voiceguard.internal:8443/ping
          REMOTE
